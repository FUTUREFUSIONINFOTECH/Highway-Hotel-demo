    .btn-amber { background: #d97706; color: #fff; }

    .seg { display: inline-flex; background: #e2e8f0; padding: 4px; border-radius: 10px; gap: 4px; flex-wrap: wrap; max-width: 100%; }
    .seg button { border: 0; background: transparent; padding: 7px 12px; border-radius: 7px; font-size: 12px; font-weight: 600; color: #475569; cursor: pointer; font-family: inherit; white-space: nowrap; }
    .seg button.active { background: #fff; color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,0.06); }

    // ---------- SAFE DOM BUILDER (FLATTENS NESTED ARRAYS) ----------
    function el(tag, attrs = {}, children = []) {
      const node = document.createElement(tag);
      for (const [k, v] of Object.entries(attrs)) {
        if (k === "class") node.className = v;
        else if (k === "style") node.style.cssText = v;
        else if (k === "checked" || k === "disabled" || k === "selected") {
          if (v) node[k] = true;
        } else if (k.startsWith("on") && typeof v === "function") {
          node.addEventListener(k.slice(2).toLowerCase(), v);
        } else if (v !== undefined && v !== null) {
          node.setAttribute(k, String(v));
        }
      }
      function appendItem(item) {
        if (item === null || item === undefined || item === false) return;
        if (Array.isArray(item)) {
          item.forEach(appendItem);
        } else if (item instanceof Node) {
          node.appendChild(item);
        } else {
          node.appendChild(document.createTextNode(String(item)));
        }
      }
      appendItem(children);
      return node;
    }

    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.style.display = "block";
      clearTimeout(t._timer);
      t._timer = setTimeout(() => { t.style.display = "none"; }, 2800);
    }

    // ---------- GEO & TELEMETRY ----------
    function haversineKm(a, b) {
      const toRad = (d) => (d * Math.PI) / 180;
      const dLat = toRad(b.lat - a.lat);
      const dLon = toRad(b.lng - a.lng);
      const h = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(a.lat)) * Math.cos(toRad(b.lat)) * Math.sin(dLon / 2) ** 2;
      return Number((6371 * 2 * Math.atan2(Math.sqrt(h), Math.sqrt(1 - h))).toFixed(1));
    }

    function getApprovedStops() {
      const approvedPartRestIds = new Set(
        state.partnerships.filter((p) => p.status === "APPROVED").map((p) => p.restaurantId)
      );
      return state.restaurants
        .filter((r) => r.status === "APPROVED" && approvedPartRestIds.has(r.id))
        .sort((a, b) => a.stopOrder - b.stopOrder);
    }

      const pts = [veh.origin, ...stops, veh.dest];
      const segs = pts.length - 1;
      const scaled = Math.max(0, Math.min(1, state.trip.progress)) * segs;
      const idx = Math.min(segs - 1, Math.floor(scaled));
      const t = scaled - idx;
      return {
        lat: Number((pts[idx].lat + (pts[idx + 1].lat - pts[idx].lat) * t).toFixed(4)),
        lng: Number((pts[idx].lng + (pts[idx + 1].lng - pts[idx].lng) * t).toFixed(4))
      };
    }

    function resolveDemoCoords(label, fallback) {
      const s = String(label || "").toLowerCase();
      if (s.includes("salem")) return { lat: 11.6643, lng: 78.1460 };
      if (s.includes("pondy") || s.includes("pondicherry") || s.includes("puducherry")) return { lat: 11.9416, lng: 79.8083 };
      if (s.includes("chennai") || s.includes("koyambedu")) return { lat: 13.0694, lng: 80.1948 };
      if (s.includes("madurai")) return { lat: 9.9391, lng: 78.1586 };
      if (s.includes("villupuram")) return { lat: 11.9401, lng: 79.4861 };
      if (s.includes("tindivanam")) return { lat: 12.2305, lng: 79.6552 };
      if (s.includes("attur")) return { lat: 11.5944, lng: 78.6003 };
      if (s.includes("kallakurichi")) return { lat: 11.7384, lng: 78.9639 };
      if (s.includes("coimbatore")) return { lat: 11.0168, lng: 76.9558 };
      if (s.includes("trichy")) return { lat: 10.7905, lng: 78.7047 };
      return fallback;
    }

    function assignRouteToBus(route) {
      const veh = state.vehicles[0];
      veh.routeId = route.id;
      veh.route = route.name;
      veh.origin = { name: route.origin.name, lat: route.origin.lat, lng: route.origin.lng };
      veh.dest = { name: route.dest.name, lat: route.dest.lat, lng: route.dest.lng };
      state.trip.progress = 0.08;
      state.auditLogs.unshift(`Assigned bus ${veh.reg} to route ${route.name} (${route.origin.name} → ${route.dest.name})`);
      showToast(`Bus ${veh.reg} set to ${route.name}`);
    }

    function getStopTelemetry(rest) {
      const veh = state.vehicles[0];
      const bus = state.trip.status === "IN_PROGRESS" ? getBusPoint() : veh.origin;
      const dist = haversineKm(bus, rest);
      const eta = Math.max(1, Math.round((dist / Math.max(state.trip.speedKmh, 25)) * 60));
      return { dist, eta };
    }

    function buildSvgRouteMap(highlightRestId) {
      const veh = state.vehicles[0];
      const approved = getApprovedStops();
      const pts = [veh.origin, ...approved, veh.dest];
      const bus = getBusPoint();
      const all = [...pts, bus];
      const minLat = Math.min(...all.map((p) => p.lat)), maxLat = Math.max(...all.map((p) => p.lat));
      const minLng = Math.min(...all.map((p) => p.lng)), maxLng = Math.max(...all.map((p) => p.lng));
      const W = 640, H = 210, px = 56, py = 34;
      const proj = (lat, lng) => ({
        x: px + ((lng - minLng) / Math.max(0.2, maxLng - minLng)) * (W - px * 2),
        y: H - py - ((lat - minLat) / Math.max(0.2, maxLat - minLat)) * (H - py * 2)
      });

      const svgNS = "http://www.w3.org/2000/svg";
      const svg = document.createElementNS(svgNS, "svg");
      svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
      svg.setAttribute("style", "width:100%; height:200px; display:block;");

      const linePts = pts.map((p) => proj(p.lat, p.lng));
      const pathD = linePts.map((p, i) => `${i === 0 ? "M" : "L"} ${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(" ");

      const baseLine = document.createElementNS(svgNS, "path");
      baseLine.setAttribute("d", pathD);
      baseLine.setAttribute("fill", "none");
      baseLine.setAttribute("stroke", "#334155");
      baseLine.setAttribute("stroke-width", "6");
      baseLine.setAttribute("stroke-linecap", "round");
      svg.appendChild(baseLine);

      const dashLine = document.createElementNS(svgNS, "path");
      dashLine.setAttribute("d", pathD);
      dashLine.setAttribute("fill", "none");
      dashLine.setAttribute("stroke", "#14b8a6");
      dashLine.setAttribute("stroke-width", "2.5");
      dashLine.setAttribute("stroke-dasharray", "6 6");
      svg.appendChild(dashLine);

      approved.forEach((r) => {
        const pt = proj(r.lat, r.lng);
        const tel = getStopTelemetry(r);
        const c = document.createElementNS(svgNS, "circle");
        c.setAttribute("cx", pt.x);
        c.setAttribute("cy", pt.y);
        c.setAttribute("r", r.id === highlightRestId ? "8" : "6");
        c.setAttribute("fill", r.id === highlightRestId ? "#d97706" : "#0f172a");
        c.setAttribute("stroke", r.id === highlightRestId ? "#fef3c7" : "#14b8a6");
        c.setAttribute("stroke-width", "2.5");
        svg.appendChild(c);

        const lbl = document.createElementNS(svgNS, "text");
        lbl.setAttribute("x", pt.x);
        lbl.setAttribute("y", pt.y - 12);
        lbl.setAttribute("text-anchor", "middle");
        lbl.setAttribute("fill", "#e2e8f0");
        lbl.setAttribute("font-size", "10");
        lbl.setAttribute("font-weight", "600");
        lbl.textContent = `${r.stopOrder}. ${r.name.split(" ")[0]}`;
        svg.appendChild(lbl);

        const sub = document.createElementNS(svgNS, "text");
        sub.setAttribute("x", pt.x);
        sub.setAttribute("y", pt.y + 17);
        sub.setAttribute("text-anchor", "middle");
        sub.setAttribute("fill", "#94a3b8");
        sub.setAttribute("font-size", "9");
        sub.setAttribute("font-family", "monospace");
        sub.textContent = `${tel.dist}km · ${tel.eta}m`;
        svg.appendChild(sub);
      });

      if (state.trip.status === "IN_PROGRESS") {
        const bp = proj(bus.lat, bus.lng);
        const halo = document.createElementNS(svgNS, "circle");
        halo.setAttribute("cx", bp.x);
        halo.setAttribute("cy", bp.y);
        halo.setAttribute("r", "14");
        halo.setAttribute("fill", "#10b981");
        halo.setAttribute("fill-opacity", "0.22");
        svg.appendChild(halo);

        const dot = document.createElementNS(svgNS, "circle");
        dot.setAttribute("cx", bp.x);
        dot.setAttribute("cy", bp.y);
        dot.setAttribute("r", "7");
        dot.setAttribute("fill", "#10b981");
        dot.setAttribute("stroke", "#fff");
        dot.setAttribute("stroke-width", "2");
        svg.appendChild(dot);

        const badge = document.createElementNS(svgNS, "text");
        badge.setAttribute("x", bp.x);
        badge.setAttribute("y", bp.y - 14);
        badge.setAttribute("text-anchor", "middle");
        badge.setAttribute("fill", "#6ee7b7");
        badge.setAttribute("font-size", "9");
        badge.setAttribute("font-weight", "700");
        badge.setAttribute("font-family", "monospace");
        badge.textContent = "LIVE BUS";
        svg.appendChild(badge);
      }

      return el("div", { class: "map-box" }, [
        el("div", { class: "row", style: "margin-bottom:8px;" }, [
          el("div", {}, [
            el("p", { class: "muted", style: "color:#94a3b8; margin:0;" }, "Live Highway Corridor Telemetry"),
            el("strong", { style: "font-size:14px;" }, `${veh.reg} · ${veh.route}`)
          ]),
          el("span", { class: "mono", style: "font-size:12px; color:#34d399;" },
            `${state.trip.status.replace(/_/g, " ")} · ${Math.round(state.trip.progress * 100)}% · ${state.trip.speedKmh} km/h`
          )
        ]),
        svg
      ]);
    }

          el("button", {
            type: "button", class: "btn btn-primary",
            onClick: () => completePayment()
          }, `Pay ₹${total} via ${state.payMethod}`)
        ]));
      }

      function completePayment() {
        if (state.simulatePayFail) {
          state.paymentFailures += 1;
          state.lastPaymentError = "Gateway authorization declined. Order was NOT confirmed.";
          render();
          return;
        }
        const newId = `ORD-2026-${Math.floor(1000 + Math.random() * 8999)}`;
        const pickup = `MS-${Math.floor(1000 + Math.random() * 8999)}`;
        const commAmt = Math.round((total * activeRest.commissionPercent) / 100);
        const gwFee = Math.round(total * 0.02);
        const payable = total - commAmt - gwFee;
        state.orders.unshift({
          id: newId,
          pickupCode: pickup,
          restaurantId: activeRest.id,
          passenger: state.passengerName.trim() || "Guest Passenger",
          phone: state.passengerPhone.trim() || "+91 98400 00000",
          mode: state.orderMode,
          guests: state.orderMode === "DINE_IN" ? state.dineInGuests : 0,
          notes: [state.specialInstructions, state.dietaryNotes].filter(Boolean).join(" · "),
          items: cartEntries.map((x) => ({ name: x.item.name, qty: x.q, price: x.item.price })),
          subtotal, gst, fee, gross: total,
          commissionPct: activeRest.commissionPercent,
          commissionAmt: commAmt,
          gatewayFee: gwFee,
          payable,
          paymentStatus: "PAID",
          status: "NEW",
          settlement: "PENDING",
          dateRange: "TODAY"
        });
        state.qrCodes[0].orders += 1;
        state.notifications.unshift({ target: "DRIVER", title: `New Order at ${activeRest.name}`, msg: `${newId} (${state.orderMode}) queued for Stop ${activeRest.stopOrder}.` });
        state.auditLogs.unshift(`Paid Order ${newId} (₹${total}) placed for ${activeRest.name}`);
        state.cart = {};
        state.activeOrderId = newId;
        state.passengerScreen = "TRACKING";
        showToast(`Payment verified! Order ${newId} sent to ${activeRest.name}.`);
        render();
      }

      if (state.passengerScreen === "TRACKING" || state.passengerScreen === "COLLECTION") {
        const order = state.orders.find((o) => o.id === state.activeOrderId) || state.orders[0];
        const rest = state.restaurants.find((r) => r.id === order.restaurantId);
        const tel = getStopTelemetry(rest);
        const steps = ["NEW", "ACCEPTED", "PREPARING", "READY", "COMPLETED"];
        const idx = steps.indexOf(order.status);

        if (state.passengerScreen === "TRACKING") {
          wrap.appendChild(el("div", { class: "card" }, [
            el("div", { class: "row" }, [
              el("div", {}, [
                el("p", { class: "muted mono", style: "margin:0;" }, `${order.id} · ${order.mode} · Payment ${order.paymentStatus}`),

              el("span", { style: `font-size:11px; font-weight:600; color:${i <= idx ? "#0f172a" : "#94a3b8"};` }, s)
            ]))),

              el("div", { class: "card", style: "background:#f8fafc;" }, [
                el("p", { class: "muted", style: "margin:0;" }, "Bus Distance"),
                el("strong", { class: "mono", style: "font-size:20px;" }, `${tel.dist} km`)
              ]),

              ])
            ])
          ]));
          wrap.appendChild(buildSvgRouteMap(rest.id));
        } else {
          wrap.appendChild(el("div", { class: "card", style: "max-width:440px; margin:0 auto; text-align:center; display:grid; gap:14px;" }, [
            el("p", { class: "muted", style: "margin:0;" }, "Order Pickup & Dine-in Pass"),

              type: "button", class: "btn btn-outline",
              onClick: () => { state.passengerScreen = "TRACKING"; render(); }
            }, "Back to Live Tracking")

      return wrap;

    function signOutPortal(portalKey) {
      if (portalKey === "DRIVER" && autoDriveTimer) {
        clearInterval(autoDriveTimer);
        autoDriveTimer = null;
        state.autoDrive = false;
      }
      const user = state.sessions[portalKey];
      state.sessions[portalKey] = null;
      state.authPhoneInput = "";
      state.authOtpSent = false;
      state.authOtpCode = "";
      if (user) {
        state.auditLogs.unshift(`${user.name} (${user.role}) signed out of ${portalKey}`);
        showToast(`Signed out ${user.name}`);
      }
      render();
    }

    // ---------- PORTAL 3: DRIVER & CONDUCTOR ----------
    function toggleAutoDrive() {
      state.autoDrive = !state.autoDrive;
      if (state.autoDrive) {
        if (state.trip.status !== "IN_PROGRESS") {
          state.trip.status = "IN_PROGRESS";
        }
        autoDriveTimer = setInterval(() => {
          if (!state.autoDrive || state.trip.status !== "IN_PROGRESS") {
            clearInterval(autoDriveTimer);
            autoDriveTimer = null;
            return;
          }
          if (state.trip.progress >= 1) {
            state.autoDrive = false;
            state.trip.status = "COMPLETED";
            clearInterval(autoDriveTimer);
            autoDriveTimer = null;
            showToast("Bus reached destination! Trip completed.");
            render();
            return;
          }
          const nextProg = Math.min(1, Number((state.trip.progress + 0.03).toFixed(2)));
          if (state.offlineMode) {
            state.offlineBuffer.push(nextProg);
          } else {
            state.trip.progress = nextProg;
          }
          render();
        }, 1200);
        showToast("Auto-Drive GPS streaming started");
      } else {
        clearInterval(autoDriveTimer);
        autoDriveTimer = null;
        showToast("Auto-Drive GPS paused");
      }
      render();
    }

              el("h3", { style: "font-size:16px;" }, "Add New Bus Number"),
              el("div", { class: "grid-2" }, [
                el("input", { type: "text", placeholder: "Bus Number (e.g. TN 30 AX 7788)", value: state.newBusForm.reg, onInput: (e) => { state.newBusForm.reg = e.target.value; } }),
                el("input", { type: "number", placeholder: "Seats", value: state.newBusForm.seats, onInput: (e) => { state.newBusForm.seats = Number(e.target.value || 44); } })
              ]),
              el("select", {
                onChange: (e) => { state.newBusForm.routeId = e.target.value; }
              }, state.routes.map((rt) => el("option", { value: rt.id, selected: rt.id === state.newBusForm.routeId }, rt.name))),
              el("button", {
                type: "button", class: "btn btn-dark",
                onClick: () => {
                  const reg = state.newBusForm.reg.trim().toUpperCase();
                  if (!reg) { showToast("Enter bus registration number"); return; }
                  const rt = state.routes.find((r) => r.id === state.newBusForm.routeId) || state.routes[0];
                  const newVeh = {
                    id: `veh-${Date.now()}`,
                    companyId: "comp-1",
                    company: "Kaveri Intercity Travels",
                    reg,
                    type: "BUS",
                    seats: state.newBusForm.seats,
                    routeId: rt.id,
                    route: rt.name,
                    origin: rt.origin,
                    dest: rt.dest,
                    driver: state.crew.find((c) => c.role === "DRIVER")?.name || "Murugan Selvam",
                    conductor: state.crew.find((c) => c.role === "CONDUCTOR")?.name || "Senthil Kumar"
                  };
                  state.vehicles.push(newVeh);
                  state.newBusForm.reg = "";
                  showToast(`Added Bus ${reg}`);
                  render();
                }
              }, "Add Bus to Fleet")
            ])
          ])
        ]));
      }

      if (state.adminTab === "ROUTES") {
        const veh = state.vehicles[0];
        wrap.appendChild(el("div", { class: "grid-2" }, [
          el("div", { class: "card", style: "display:grid; gap:12px;" }, [
            el("h3", { style: "font-size:16px;" }, `Configured Routes & Departure Stops (${state.routes.length})`),
            state.routes.map((rt) => {
              const isAssigned = veh.routeId === rt.id;
              return el("div", { style: "padding:12px; border:1px solid var(--border); border-radius:10px; display:grid; gap:6px;" }, [
                el("div", { class: "row" }, [
                  el("div", {}, [
                    el("strong", {}, rt.name),
                    el("p", { class: "muted", style: "margin:2px 0 0;" }, `Departure: ${rt.origin.name} → Destination: ${rt.dest.name}`)
                  ]),
                  isAssigned
                    ? el("span", { style: "font-size:11px; font-weight:700; color:var(--ok);" }, `ACTIVE ON ${veh.reg}`)
                    : el("button", {
                        type: "button", class: "btn btn-primary btn-sm",
                        onClick: () => { assignRouteToBus(rt); render(); }
                      }, `Assign to ${veh.reg}`)
                ]),
                el("p", { class: "muted mono", style: "margin:0; font-size:11px;" },
                  `Departure Stops: ${(rt.departureStops || []).join(" → ") || "Direct Express"}`
                )
              ]);
            })
          ]),
          el("div", { class: "card", style: "display:grid; gap:10px; height:fit-content;" }, [
            el("h3", { style: "font-size:16px;" }, "Create Route & Departure Stops"),
            el("div", { style: "display:flex; gap:6px; flex-wrap:wrap;" }, [
              el("button", {
                type: "button", class: "btn btn-outline btn-sm",
                onClick: () => {
                  state.newRouteForm = {
                    name: "Salem → Pondy Express",
                    origin: "Salem (New Bus Stand)",
                    destination: "Pondicherry (New Bus Stand)",
                    stopsText: "Attur Bypass, Kallakurichi Toll, Villupuram Bypass"
                  };
                  render();
                }
              }, "Preset: Salem → Pondy"),
              el("button", {
                type: "button", class: "btn btn-outline btn-sm",
                onClick: () => {
                  state.newRouteForm = {
                    name: "Salem → Chennai Express",
                    origin: "Salem (New Bus Stand)",
                    destination: "Chennai (Koyambedu)",
                    stopsText: "Attur Bypass, Ulundurpet Toll Plaza, Tindivanam Toll Plaza"
                  };
                  render();
                }
              }, "Preset: Salem → Chennai")
            ]),
            el("input", {
              type: "text", placeholder: "Departure Point (e.g. Salem)",
              value: state.newRouteForm.origin,
              onInput: (e) => { state.newRouteForm.origin = e.target.value; }
            }),
            el("input", {
              type: "text", placeholder: "Destination (e.g. Pondy or Chennai)",
              value: state.newRouteForm.destination,
              onInput: (e) => { state.newRouteForm.destination = e.target.value; }
            }),
            el("input", {
              type: "text", placeholder: "Route Name (optional)",
              value: state.newRouteForm.name,
              onInput: (e) => { state.newRouteForm.name = e.target.value; }
            }),
            el("input", {
              type: "text", placeholder: "Departure / Intermediate Stops (comma separated)",
              value: state.newRouteForm.stopsText,
              onInput: (e) => { state.newRouteForm.stopsText = e.target.value; }
            }),
            el("button", {
              type: "button", class: "btn btn-primary",
              onClick: () => {
                const orig = state.newRouteForm.origin.trim();
                const dest = state.newRouteForm.destination.trim();
                if (!orig || !dest) { showToast("Enter departure point and destination"); return; }
                const rName = state.newRouteForm.name.trim() || `${orig} → ${dest}`;
                const stops = state.newRouteForm.stopsText.split(",").map((s) => s.trim()).filter(Boolean);
                const newRt = {
                  id: `route-${Date.now()}`,
                  name: rName,
                  origin: { name: orig, ...resolveDemoCoords(orig, { lat: 11.6643, lng: 78.1460 }) },
                  dest: { name: dest, ...resolveDemoCoords(dest, { lat: 13.0694, lng: 80.1948 }) },
                  departureStops: stops
                };
                state.routes.push(newRt);
                assignRouteToBus(newRt);
                state.newRouteForm = { name: "", origin: "", destination: "", stopsText: "" };
                render();
              }
            }, "Create & Assign Route to Bus")
          ])
        ]));
      }

      if (state.adminTab === "OVERVIEW") {
        wrap.appendChild(el("div", { class: "grid-2" }, [
          el("div", { class: "card", style: "display:grid; gap:12px;" }, [
            el("h3", { style: "font-size:16px;" }, "Registered Highway Restaurants"),
            state.restaurants.map((r) => el("div", { class: "row", style: "padding-bottom:10px; border-bottom:1px solid #f1f5f9;" }, [
              el("div", {}, [
                el("strong", {}, r.name),
                el("p", { class: "muted", style: "margin:2px 0 0;" }, `${r.city} · Stop ${r.stopOrder} · GST ${r.gst}`)
              ]),
              el("div", { style: "display:flex; gap:6px; align-items:center;" }, [
                el("input", {
                  type: "number", min: 0, max: 30, value: r.commissionPercent, style: "width:60px; padding:5px 8px; font-size:12px;",
                  title: "Commission %",
                  onChange: (e) => { r.commissionPercent = Number(e.target.value || 5); showToast(`${r.name} commission set to ${r.commissionPercent}%`); render(); }
                }),
                el("span", { style: `font-size:11px; font-weight:700; color:${r.status === "APPROVED" ? "var(--ok)" : "var(--warn)"};` }, r.status),
                r.status !== "APPROVED"
                  ? el("button", { type: "button", class: "btn btn-primary btn-sm", onClick: () => { r.status = "APPROVED"; r.acceptingOrders = true; state.auditLogs.unshift(`Approved restaurant ${r.name}`); showToast(`Approved ${r.name}`); render(); } }, "Approve")
                  : el("button", { type: "button", class: "btn btn-danger btn-sm", onClick: () => { r.status = "SUSPENDED"; r.acceptingOrders = false; state.auditLogs.unshift(`Suspended restaurant ${r.name}`); render(); } }, "Suspend")
              ])
            ]))
          ]),
          el("div", { class: "card", style: "display:grid; gap:10px; height:fit-content;" }, [
            el("h3", { style: "font-size:16px;" }, "Register New Highway Restaurant"),
            el("input", { type: "text", placeholder: "Restaurant name", value: state.newRestForm.name, onInput: (e) => { state.newRestForm.name = e.target.value; } }),
            el("input", { type: "text", placeholder: "Owner name", value: state.newRestForm.owner, onInput: (e) => { state.newRestForm.owner = e.target.value; } }),
            el("div", { class: "grid-2" }, [
              el("input", { type: "text", placeholder: "City / Toll Plaza", value: state.newRestForm.city, onInput: (e) => { state.newRestForm.city = e.target.value; } }),
              el("input", { type: "number", placeholder: "Commission %", value: state.newRestForm.commission, onInput: (e) => { state.newRestForm.commission = Number(e.target.value || 5); } })
            ]),
            el("button", {
              type: "button", class: "btn btn-primary",
              onClick: () => {
                if (!state.newRestForm.name.trim()) { showToast("Enter restaurant name"); return; }
                const id = `rest-${Date.now()}`;
                state.restaurants.push({
                  id,
                  name: state.newRestForm.name.trim(),
                  owner: state.newRestForm.owner.trim() || "Partner Owner",
                  city: state.newRestForm.city.trim() || "Dindigul",
                  address: `Highway Plaza, ${state.newRestForm.city || "NH-44"}`,
                  phone: "+91 98400 55667",
                  gst: "33AAACM1234A1Z5",
                  fssai: "12426000000999",
                  bank: "HDFC0001000 · •••• 1001",
                  hours: "00:00 – 23:59",
                  lat: 10.3673,
                  lng: 77.9803,
                  commissionPercent: state.newRestForm.commission,
                  status: "APPROVED",
                  acceptingOrders: true,
                  stopOrder: state.restaurants.length + 1,
                  window: "02:00 – 02:20",
                  cuisine: "Highway Express Meals",
                  staff: []
                });
                state.menuItems.push({ id: `m-${Date.now()}`, restaurantId: id, category: "Meals", name: "Highway Express Thali", price: 210, prep: 10, veg: true, available: true });
                state.newRestForm.name = "";
                state.newRestForm.owner = "";
                state.newRestForm.city = "";
                showToast("Restaurant created & approved");
                render();
              }
            }, "Create & Approve Restaurant")
          ])
        ]));
      }

      if (state.adminTab === "PARTNERSHIPS") {
        wrap.appendChild(el("div", { class: "card", style: "display:grid; gap:12px;" }, [
          el("h3", { style: "font-size:16px;" }, "Bus–Route–Restaurant Partnerships (TN 45 AB 1234)"),
          state.partnerships.map((p) => {
            const r = state.restaurants.find((x) => x.id === p.restaurantId);
            return el("div", { class: "row", style: "padding-bottom:10px; border-bottom:1px solid #f1f5f9;" }, [
              el("div", {}, [
                el("strong", { class: "mono" }, `Stop ${p.stopOrder}: ${r?.name || p.restaurantId}`),
                el("p", { class: "muted", style: "margin:2px 0 0;" }, `Arrival Window: ${p.window} · Restaurant Status: ${r?.status}`)
              ]),
              el("div", { style: "display:flex; gap:8px; align-items:center;" }, [
                el("span", { style: `font-size:12px; font-weight:700; color:${p.status === "APPROVED" ? "var(--ok)" : "var(--warn)"};` }, p.status),
                el("button", {
                  type: "button", class: "btn btn-outline btn-sm",
                  onClick: () => {
                    p.status = p.status === "APPROVED" ? "INACTIVE" : "APPROVED";
                    if (p.status === "APPROVED" && r && r.status !== "APPROVED") { r.status = "APPROVED"; r.acceptingOrders = true; }
                    state.auditLogs.unshift(`Partnership ${r?.name} set to ${p.status}`);
                    render();
                  }
                }, p.status === "APPROVED" ? "Deactivate" : "Approve Stop")
              ])
            ]);
          })
        ]));
      }

      if (state.adminTab === "QR") {
        wrap.appendChild(el("div", { style: "display:grid; gap:16px;" }, [
          el("div", { class: "card", style: "display:grid; gap:12px;" }, [
            el("h3", { style: "font-size:16px;" }, "Generate QR Code by Bus Number & Hotel(s)"),
            el("div", { class: "grid-2" }, [
              el("div", {}, [
                el("label", { class: "muted", style: "display:block; margin-bottom:6px;" }, "1. Select Bus Number"),
                el("select", {
                  onChange: (e) => { state.qrGenForm.vehicleId = e.target.value; }
                }, state.vehicles.map((v) => el("option", { value: v.id, selected: v.id === state.qrGenForm.vehicleId }, `${v.reg} (${v.route})`)))
              ]),
              el("div", {}, [
                el("label", { class: "muted", style: "display:block; margin-bottom:6px;" }, "2. Select Hotel(s) / Restaurants"),
                el("div", { style: "display:grid; gap:6px; padding:10px; border:1px solid var(--border); border-radius:10px; background:#f8fafc;" },
                  state.restaurants.map((r) => {
                    const isChecked = state.qrGenForm.restaurantIds.includes(r.id);
                    return el("label", { style: "display:flex; align-items:center; gap:8px; font-size:12px; cursor:pointer;" }, [
                      el("input", {
                        type: "checkbox", style: "width:auto;",
                        checked: isChecked,
                        onChange: (e) => {
                          if (e.target.checked) {
                            if (!state.qrGenForm.restaurantIds.includes(r.id)) state.qrGenForm.restaurantIds.push(r.id);
                          } else {
                            state.qrGenForm.restaurantIds = state.qrGenForm.restaurantIds.filter((id) => id !== r.id);
                          }
                        }
                      }),
                      `${r.name} (${r.city})`
                    ]);
                  })
                )
              ])
            ]),
            el("button", {
              type: "button", class: "btn btn-primary", style: "width:fit-content;",
              onClick: () => {
                const veh = state.vehicles.find((v) => v.id === state.qrGenForm.vehicleId) || state.vehicles[0];
                const restIds = state.qrGenForm.restaurantIds.slice();
                if (restIds.length === 0) { showToast("Select at least one hotel/restaurant"); return; }
                restIds.forEach((rid) => {
                  const r = state.restaurants.find((x) => x.id === rid);
                  if (r && r.status !== "APPROVED") { r.status = "APPROVED"; r.acceptingOrders = true; }
                });
                const cleanReg = veh.reg.replace(/\s+/g, "");
                const newQr = {
                  id: `qr-${veh.id}-${Date.now().toString().slice(-4)}`,
                  token: `MSQR_${cleanReg}_${Math.random().toString(16).slice(2, 6).toUpperCase()}`,
                  vehicleId: veh.id,
                  vehicle: veh.reg,
                  restaurantIds: restIds,
                  active: true,
                  scans: 0,
                  orders: 0
                };
                state.qrCodes.unshift(newQr);
                state.selectedQrId = newQr.id;
                state.auditLogs.unshift(`Generated QR ${newQr.token} for Bus ${veh.reg} (${restIds.length} hotel(s))`);
                showToast(`Generated QR for ${veh.reg}`);
                render();
              }
            }, "Generate Bus + Hotel QR Code")
          ]),
          el("div", { class: "grid-2" }, state.qrCodes.map((q) => {
            const hotelNames = (q.restaurantIds || [])
              .map((rid) => state.restaurants.find((r) => r.id === rid)?.name)
              .filter(Boolean)
              .join(", ");
            return el("div", { class: "card", style: "display:grid; gap:10px;" }, [
              el("div", { class: "row" }, [
                el("div", {}, [
                  el("h3", { class: "mono" }, q.vehicle),
                  el("p", { style: "font-size:12px; color:var(--accent); font-weight:600; margin:4px 0 0;" }, `Hotels: ${hotelNames || "All Approved Stops"}`),
                  el("p", { class: "muted mono", style: "margin:4px 0 0;" }, `Token: ${q.token}`),
                  el("p", { class: "muted", style: "margin:4px 0 0;" }, `Scans: ${q.scans} · Orders: ${q.orders} · ${q.active ? "ACTIVE" : "DISABLED"}`)
                ])
              ]),
              el("div", { style: "display:flex; gap:8px; flex-wrap:wrap;" }, [
                el("button", {
                  type: "button", class: "btn btn-primary btn-sm",
                  onClick: () => {
                    state.selectedQrId = q.id;
                    state.portal = "PASSENGER";
                    state.passengerScreen = "RESTAURANTS";
                    render();
                  }
                }, "Open in Passenger QR"),
                el("button", {
                  type: "button", class: "btn btn-outline btn-sm",
                  onClick: () => { q.token = `MSQR_${q.vehicle.replace(/\s+/g, "")}_${Math.random().toString(16).slice(2,6).toUpperCase()}`; showToast("QR token regenerated"); render(); }
                }, "Regenerate Token"),
                el("button", {
                  type: "button", class: `btn btn-sm ${q.active ? "btn-danger" : "btn-outline"}`,
                  onClick: () => { q.active = !q.active; showToast(`QR ${q.active ? "activated" : "deactivated"}`); render(); }
                }, q.active ? "Deactivate QR" : "Activate QR")
              ])
            ]);
          }))
        ]));
      }

      if (state.adminTab === "SETTLEMENTS") {
        wrap.appendChild(el("div", { class: "card", style: "overflow-x:auto;" }, [
          el("table", {}, [
            el("thead", {}, el("tr", {}, ["Order", "Restaurant", "Status", "Gross", "Commission", "Payable", "Settlement"].map((h) => el("th", {}, h)))),
            el("tbody", {}, filteredOrders.map((o) => el("tr", {}, [
              el("td", { class: "mono" }, o.id),
              el("td", {}, state.restaurants.find((r) => r.id === o.restaurantId)?.name || ""),
              el("td", {}, o.status),
              el("td", { class: "num" }, `₹${o.gross}`),
              el("td", { class: "num" }, `₹${o.commissionAmt}`),
              el("td", { class: "num" }, `₹${o.payable}`),
              el("td", {}, o.settlement === "SETTLED"
                ? el("span", { style: "color:var(--ok); font-weight:700;" }, "SETTLED")
                : o.paymentStatus === "PAID" && o.status !== "REFUNDED"
                  ? el("button", { type: "button", class: "btn btn-primary btn-sm", onClick: () => { o.settlement = "SETTLED"; state.auditLogs.unshift(`Settled ₹${o.payable} for ${o.id}`); showToast(`Settled ₹${o.payable}`); render(); } }, "Settle Payout")
                  : el("span", { class: "muted" }, o.status)
              )
            ])))
          ])
        ]));
      }

      if (state.adminTab === "AUDIT") {
        wrap.appendChild(el("div", { class: "card", style: "display:grid; gap:8px;" }, [
          el("h3", { style: "font-size:16px;" }, "Platform Audit Trail"),
          state.auditLogs.map((msg) => el("div", { style: "padding:10px; background:#f8fafc; border:1px solid var(--border); border-radius:8px; font-size:12px;" }, msg))
        ]));
      }
      return wrap;
    }

    function renderHeader() {
      const nav = document.getElementById("portal-nav");
      nav.replaceChildren();
      [
        ["PASSENGER", "Passenger QR"],
        ["RESTAURANT", "Restaurant App"],
        ["DRIVER", "Driver & Crew"],
        ["ADMIN", "Admin Console"]
      ].forEach(([key, label]) => {
        nav.appendChild(
          el("button", {
            type: "button",
            class: `nav-btn ${state.portal === key ? "active" : ""}`,
            onClick: () => { state.portal = key; render(); }
          }, label)
        );
      });

      const actions = document.getElementById("header-actions");
      if (actions) {
        const activeSess = state.portal !== "PASSENGER" ? state.sessions[state.portal] : null;
        const btns = [
          activeSess ? el("button", {
            type: "button",
            class: "btn btn-outline",
            onClick: () => signOutPortal(state.portal)
          }, `Sign Out (${activeSess.name.split(" ")[0]})`) : null,
          el("button", {
            type: "button",
            class: "btn btn-outline",
            onClick: () => {
              clearInterval(autoDriveTimer);
              autoDriveTimer = null;
              state = createInitialState();
              showToast("Demo reset to initial state");
              render();
            }
          }, "Reset Demo")
        ].filter(Boolean);
        actions.replaceChildren(...btns);
      }
    }

    function render() {
      renderHeader();
      const root = document.getElementById("app-root");
      root.replaceChildren(
        state.portal === "PASSENGER" ? renderPassenger() :
        state.portal === "RESTAURANT" ? renderRestaurant() :
        state.portal === "DRIVER" ? renderDriver() :
        renderAdmin()
      );
    }

    document.getElementById("brand-home").onclick = () => { state.portal = "PASSENGER"; state.passengerScreen = "QR_LANDING"; render(); };

    render();
  </script>
</body>
</html>
